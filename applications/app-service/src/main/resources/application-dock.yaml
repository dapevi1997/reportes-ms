server:
  port: ${APP_PUERTO}
spring:
  application:
    name: "ReportesMS"
  devtools:
    add-properties: false
  h2:
    console:
      enabled: true
      path: "/h2"
entrypoint:
  sqs:
    region: ${ENTRY_SQS_REGION}
    #endpoint: "http://localhost:4566"
    queueUrl: ${ENTRY_SQS_URL_QUEUE}
    waitTimeSeconds: 20
    maxNumberOfMessages: 10
    visibilityTimeoutSeconds: 10
    numberOfThreads: 1
management:
  endpoints:
    web:
      exposure:
        include: "health,prometheus"
  health:
    circuitbreakers:
      enabled: true
  endpoint:
    health:
      probes:
        enabled: true
cors:
  allowed-origins: "http://localhost:4200,http://localhost:8080"
rutas:
  caminos:
    reportes: "/api/v1/reportes"
springdoc:
  swagger-ui:
    path: "/api/v1/reportes/swagger-docs"
  api-docs:
    path: "/api/v1/reportes/api-docs"
    groups:
      enabled: true
jwt:
  expiration: ${JWT_EXPIRATION}
aws:
  region: ${DYNAMO_REGION}
    #endpoint: "http://localhost:8000"
adapter:
  restconsumer:
    timeout: ${TIMEOUT_REST_CONSUMER}
    hostSolicitudes: ${HOST_SOLICITUDES}
    hostAutenticacion: ${HOST_AUTENTICACION}
    portSolicitudes: ${PORT_SOLICITUDES}
    portAutenticacion: ${PORT_AUTENTICACION}
resilience4j:
  circuitbreaker:
    instances:
      testGet:
        registerHealthIndicator: true
        failureRateThreshold: 50
        slowCallRateThreshold: 50
        slowCallDurationThreshold: "2s"
        permittedNumberOfCallsInHalfOpenState: 3
        slidingWindowSize: 10
        minimumNumberOfCalls: 10
        waitDurationInOpenState: "10s"
      testPost:
        registerHealthIndicator: true
        failureRateThreshold: 50
        slowCallRateThreshold: 50
        slowCallDurationThreshold: "2s"
        permittedNumberOfCallsInHalfOpenState: 3
        slidingWindowSize: 10
        minimumNumberOfCalls: 10
        waitDurationInOpenState: "10s"
